#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.tile{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1;padding:0;border:0;border-radius:6px;overflow:hidden;background:rgba(64,84,116,.55);box-shadow:0 1px 0 rgba(255,255,255,.5);cursor:pointer}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 4px 10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.3);pointer-events:none}
.em{font-size:11px;color:rgba(30,45,70,.4)}
.name{height:26px;margin-top:6px;padding:0 4px;background:linear-gradient(#e3e8ef,#c8d1de);border:2px solid #8190a6;border-radius:3px;font-weight:700;font-size:13px;line-height:22px;text-align:center;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(5,10,18,.7)}
.panel{width:100%;max-width:560px;max-height:92%;margin:0 auto;overflow-y:auto;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(#e8ecf1,#c9d0da);border-radius:22px 22px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
h2{margin:0 0 4px;font-size:22px}
.mut{margin:4px 0;color:var(--mut);font-size:14px}
input,textarea{display:block;width:100%;margin-top:10px;padding:13px 14px;background:#f4f6f9;color:var(--ink);border:1px solid #8493a8;border-radius:10px;font:inherit;font-size:16px}
textarea{min-height:72px;resize:vertical}
:focus-visible{outline:2px solid #2a62c9;outline-offset:2px}
.choice{display:block;width:100%;margin-top:12px;padding:16px;text-align:left;background:#eef1f5;color:var(--ink);border:1px solid #8f9db2;border-radius:12px;font:inherit;cursor:pointer}
.choice b{display:block;font-size:17px}
.choice span{color:var(--mut);font-size:14px}
.photo{display:grid;place-items:center;aspect-ratio:4/3;margin-top:12px;border:2px dashed #7d8ca3;border-radius:12px;background:#dde3ec center/cover no-repeat;color:#2a4a7f;font-weight:700;cursor:pointer}
.hero{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:14px}
.me{display:flex;align-items:center;gap:14px}
.mepic{flex:none;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;border:4px solid #1d2c47;background:#34507a center/cover no-repeat;color:#fff;font-size:30px;font-weight:700}
pre{margin:8px 0 0;padding:12px;background:#1b2230;color:#d6dde8;border-radius:10px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.row{display:flex;gap:10px;margin-top:16px}
.go,.ghost{flex:1;padding:14px;border:0;border-radius:10px;font:700 16px Arial,sans-serif;cursor:pointer}
.go{background:#1b2a44;color:#fff}
.ghost{background:#bcc6d4;color:var(--ink)}
.wide{width:100%;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:90%;padding:10px 16px;border-radius:20px;background:#1b2a44;color:#fff;font-size:14px}
</style>
</head>

<div id="win">

<div id="sheet" class="sheet" hidden><div class="panel" id="panel"></div></div>
<div id="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let A=ld('ucap_avatars',[]),U=ld('ucap_user',null);
function save(){try{localStorage.setItem('ucap_avatars',JSON.stringify(A));localStorage.setItem('ucap_user',JSON.stringify(U));return true}catch(e){toast('Couldn’t save. Storage is full.');return false}}
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},2600)}
function openSheet(h){$('panel').innerHTML=h;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
const slugify=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'avatar';

function shrink(file,max){
  const draw=(src,w,h)=>{const r=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)};
  const viaReader=()=>new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('could not read file'));fr.onload=()=>{const i=new Image();i.onload=()=>{try{res(draw(i,i.width,i.height))}catch(e){rej(e)}};i.onerror=()=>rej(new Error('format not supported'));i.src=fr.result};fr.readAsDataURL(file)});
  if(window.createImageBitmap){return createImageBitmap(file).then(b=>draw(b,b.width,b.height)).catch(viaReader)}
  return viaReader();
}

function renderAcct(){
  const b=$('acct');
  if(!U){b.className='';b.style.backgroundImage='';b.textContent='Login';return}
  b.className='in';
  if(U.pic){b.textContent='';b.style.backgroundImage='url("'+U.pic+'")'}
  else{b.style.backgroundImage='';b.textContent=(U.name||'?').charAt(0).toUpperCase()}
}

function render(){
  const n=Math.max(6,Math.ceil((A.length+1)/3)*3);let h='';
  for(let i=0;i<n;i++){
    const a=A[i];
    h+='<div><button class="tile" data-i="'+(a?i:-1)+'" aria-label="'+(a?esc(a.name):'Empty slot')+'">'+(a?(a.img?'<img src="'+a.img+'" alt="">':'<span style="font-size:40px;font-weight:700;color:#e8eef7">'+esc(a.name.charAt(0).toUpperCase())+'</span>'):'<span class="em">Empty</span>')+'</button><div class="name">'+(a?'@'+esc(a.name):'')+'</div></div>';
  }
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('.tile').forEach(b=>{b.onclick=()=>{const i=+b.dataset.i;i<0?pick():show(i)}});
}

function loginSheet(){
  openSheet('<h2>Log in</h2><p class="mut">Demo login for now. It’s saved on this device only.</p>'
   +'<button class="choice" id="g"><b>Continue with Google</b><span>Will use your Google account picture once the backend is added.</span></button>'
   +'<input id="em" type="email" placeholder="Email" autocomplete="email">'
   +'<div class="row"><button class="ghost" id="x">Cancel</button><button class="go" id="ok">Continue</button></div>');
  $('g').onclick=()=>toast('Google sign-in connects once the backend is added.');
  $('x').onclick=closeSheet;
  $('ok').onclick=()=>{const e=$('em').value.trim();if(!e){toast('Enter an email first.');return}U={name:e.split('@')[0],email:e,pic:''};if(save()){closeSheet();renderAcct()}else U=null};
}

function accountSheet(){
  openSheet('<div class="me"><div class="mepic" id="mp">'+(U.pic?'':esc((U.name||'?').charAt(0).toUpperCase()))+'</div><div><h2>'+esc(U.name)+'</h2><p class="mut">'+esc(U.email||'')+'</p></div></div>'
   +'<label class="choice"><b>Change picture</b><span>Pick a photo from your device.</span><input id="pf" type="file" accept="image/*" hidden></label>'
   +'<button class="choice" id="s1"><b>Platform settings</b><span>Coming soon</span></button>'
   +'<button class="choice" id="s2"><b>MCP connection</b><span>Coming soon</span></button>'
   +'<div class="row"><button class="ghost" id="lo">Log out</button><button class="go" id="cl">Done</button></div>');
  if(U.pic)$('mp').style.backgroundImage='url("'+U.pic+'")';
  $('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;shrink(f,256).then(d=>{U.pic=d;if(save()){renderAcct();accountSheet()}}).catch(err=>toast('Couldn’t read that photo: '+((err&&err.message)||'unknown error')))};
  $('s1').onclick=$('s2').onclick=()=>toast('Coming soon.');
  $('lo').onclick=()=>{U=null;save();closeSheet();renderAcct()};
  $('cl').onclick=closeSheet;
}

function pick(){
  openSheet('<h2>New avatar</h2><button class="choice" id="c1"><b>Custom character</b><span>Name it, add a photo and describe it.</span></button><button class="choice" id="c2"><b>Self-avatar</b><span>Take a selfie to use as your own baseline.</span></button>');
  $('c1').onclick=()=>form('character');
  $('c2').onclick=()=>form('self');
}

function form(type){
  const self=type==='self';let img='';
  openSheet('<h2>'+(self?'Self-avatar':'New character')+'</h2>'
   +'<label class="photo" id="ph"><input id="f" type="file" accept="image/*" '+(self?'capture="user" ':'')+'hidden><span id="pt">'+(self?'Take a selfie':'Add a reference photo')+'</span></label>'
   +'<input id="n" placeholder="Name" maxlength="40" autocomplete="off">'
   +'<textarea id="t" placeholder="Physical traits"></textarea>'
   +'<textarea id="s" placeholder="Style and camera notes"></textarea>'
   +'<textarea id="o" placeholder="Persona or backstory"></textarea>'
   +'<div class="row"><button class="ghost" id="x">Cancel</button><button class="go" id="ok">Save avatar</button></div>');
  $('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{img=await shrink(f,640);$('ph').style.backgroundImage='url("'+img+'")';$('pt').hidden=true}catch(err){toast('Couldn’t read that photo: '+((err&&err.message)||'unknown error'))}};
  $('x').onclick=closeSheet;
  $('ok').onclick=()=>{
    const name=$('n').value.trim();
    if(!name){toast('Add a name first.');$('n').focus();return}
    const base=slugify(name);let s=base,k=2;
    while(A.some(a=>a.slug===s))s=base+'_'+k++;
    A.push({slug:s,name,type,img,traits:$('t').value.trim(),style:$('s').value.trim(),notes:$('o').value.trim()});
    if(save()){closeSheet();render()}else A.pop();
  };
}

function show(i){
  const a=A[i];
  const j=JSON.stringify({mention:'@'+a.slug,name:a.name,type:a.type==='self'?'self-avatar':'character',physical_traits:a.traits,style_notes:a.style,persona:a.notes,reference_image:a.img?'(attached)':null},null,2);
  openSheet((a.img?'<img class="hero" src="'+a.img+'" alt="">':'')
   +'<h2>@'+esc(a.name)+'</h2>'
   +'<p class="mut">Once your AI is connected, writing @'+esc(a.slug)+' will fetch this.</p>'
   +'<pre>'+esc(j)+'</pre>'
   +'<div class="row"><button class="ghost" id="d">Delete</button><button class="go" id="cp">Copy</button></div>'
   +'<button class="ghost wide" id="cl">Close</button>');
  let armed=false;
  $('d').onclick=()=>{if(!armed){armed=true;$('d').textContent='Tap again to delete';return}A.splice(i,1);save();closeSheet();render()};
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(j);toast('Copied.')}catch(e){toast('Couldn’t copy. Select the text instead.')}};
  $('cl').onclick=closeSheet;
}

$('plus').onclick=pick;
$('acct').onclick=()=>{U?accountSheet():loginSheet()};
renderAcct();render();
</script>
</body>
</html>
